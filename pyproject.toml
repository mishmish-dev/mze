[project]
name = "mze"
version = "0.1.0"
description = "Memoizing command executor"
requires-python = ">=3.14, <3.15"
dependencies = [
    "duckdb>=1.5.3, <2.0.0",
    "blake3>=1.0.8, <2.0.0",
    "click>=8.4.1, <9.0.0",
]

[project.scripts]
mze = "mze.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mze"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
